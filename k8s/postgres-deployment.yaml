apiVersion: apps/v1
kind: Deployment
metadata:
  name: cga-db-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cga-db
  template:
    metadata:
      labels:
        app: cga-db
    spec:
      containers:
        - name: cga-db
          image: cga-db:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "cga_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"