apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cga-metrology-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JossuEL55/CGA-Jenkins.git
    targetRevision: master
    path: argocd-manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cga-metrology
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
