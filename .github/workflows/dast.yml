name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL reachable from Docker on the Windows self-hosted Minikube machine
        required: true
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify target availability
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -TargetUrl '${{ inputs.target_url }}'

      - name: Run observational ZAP Baseline
        shell: pwsh
        run: ./scripts/run-zap.ps1 -TargetUrl '${{ inputs.target_url }}' -ReportDirectory '${{ runner.temp }}/zap-reports'

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/zap-reports/**
          if-no-files-found: warn
